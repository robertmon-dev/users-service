version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    paths:
      - app/models/ent
      - tests/mocks

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - app/models/ent
      - tests/mocks
