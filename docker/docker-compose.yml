name: users-service

x-kafka-env: &kafka-env
  KAFKA_CFG_PROCESS_ROLES: controller,broker
  KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9094,2@kafka-2:9094,3@kafka-3:9094
  ALLOW_PLAINTEXT_LISTENER: "yes"
  KAFKA_KRAFT_CLUSTER_ID: pLcxyRuTQbSuH-Tv1FBVzg

services:
  postgres:
    image: postgres:15-alpine
    container_name: users_service_db
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-users_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-users_service_password}
      POSTGRES_DB: ${DB_NAME:-users_db}
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/certs/server.crt"
      - "-c"
      - "ssl_key_file=/certs/server.key"
      - "-c"
      - "ssl_ca_file=/certs/ca.crt"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs:/certs:ro
    networks:
      - users-service-network

  redis:
    image: redis:alpine
    container_name: users_service_redis
    volumes:
      - redis_data:/data
    networks:
      - users-service-network

  kafka-1:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: users_service_kafka_1
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094,EXTERNAL://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9093
    volumes:
      - kafka_1_data:/bitnami/kafka
    networks:
      - users-service-network

  kafka-2:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: users_service_kafka_2
    ports:
      - "9095:9095"
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: 2
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094,EXTERNAL://:9095
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
    volumes:
      - kafka_2_data:/bitnami/kafka
    networks:
      - users-service-network

  kafka-3:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: users_service_kafka_3
    ports:
      - "9097:9097"
    environment:
      <<: *kafka-env
      KAFKA_CFG_NODE_ID: 3
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094,EXTERNAL://:9097
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9097
    volumes:
      - kafka_3_data:/bitnami/kafka
    networks:
      - users-service-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: users_service_app
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports:
      - "8000:8000"
    volumes:
      - ..:/src
    depends_on:
      - postgres
      - redis
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - users-service-network

volumes:
  postgres_data:
  redis_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:

networks:
  users-service-network:
    driver: bridge
