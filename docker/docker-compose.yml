services:
  postgres:
    image: postgres:15-alpine
    container_name: users_service_db
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-users_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-users_service_password}
      POSTGRES_DB: ${DB_NAME:-users_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - users-service-network

  redis:
    image: redis:alpine
    container_name: users_service_redis
    volumes:
      - redis_data:/data
    networks:
      - users-service-network

  kafka:
    image: bitnami/kafka:3.7
    container_name: users_service_kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9094
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094,EXTERNAL://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - users-service-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: users_service_app
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    volumes:
      - ..:/src
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - users-service-network

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  users-service-network:
    driver: bridge
